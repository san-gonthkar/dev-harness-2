[pytest]
asyncio_mode = auto
testpaths = tests
# Global safety net: no single test may hang a lane forever. The smoke lane
# tightens this further with --timeout=120. Override per-run with --timeout=<s>.
timeout = 600
timeout_method = thread
markers =
    unit: one module, all collaborators faked (PR tier)
    property: hypothesis-driven invariants (PR tier)
    contract: producer output parsed by real consumer parser (PR tier)
    integration: 2+ real subsystems, real SQLite/sockets, fake providers (PR tier)
    negative: asserts the correct failure (PR tier)
    timing: latency/throughput SLOs, machine-sensitive (NIGHTLY tier)
    slow: soaks, memory-growth, large-volume (NIGHTLY tier)
    e2e: whole system through the daemon (NIGHTLY tier)
addopts = --strict-markers --strict-config -p tests.support.markers