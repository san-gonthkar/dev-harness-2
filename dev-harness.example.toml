# Dev Harness example configuration (V11 0.8)
# Copy to dev-harness.toml and adjust. Provider blocks:
#   rpm, tpm, max_concurrency, context_window, num_ctx, keep_alive,
#   usd_per_mtok_in, usd_per_mtok_out, auth, base_url
#
# auth = "api_key" (default) resolves the credential from
#   DEV_HARNESS_<PROVIDER>_API_KEY -> OS keyring -> 0600 file.
# auth = "login" is reserved for a future OAuth device flow and fails closed.
workspace_path = "."

budget_usd_per_run = 0.50
budget_usd_per_day = 5.00

[broker]
allow_unbrokered = false
# Optional. Omit to discover the broker's endpoint automatically: the daemon
# binds a dynamic port and publishes it. Set only to pin a fixed address,
# e.g. endpoint = "tcp:127.0.0.1:8765".
# endpoint = "unix:/home/you/.local/share/dev-harness/broker.sock"

[providers.anthropic]
rpm = 50
tpm = 200000
max_concurrency = 2
context_window = 200000
usd_per_mtok_in = 3.00
usd_per_mtok_out = 15.00

[providers.openrouter]
rpm = 50
tpm = 200000
max_concurrency = 2
context_window = 128000
usd_per_mtok_in = 0.50
usd_per_mtok_out = 1.50
auth = "api_key"

# Ollama integration disabled (2026-09-27). Uncomment to re-enable local
# inference:
# [providers.ollama]
# max_concurrency = 1
# num_ctx = 8192
# keep_alive = "30m"
# context_window = 8192
