# Local-only profile (V11 10.4): Ollama + Qwen 2.5 Coder, no hosted providers.
# Copy to dev-harness.toml for a fully local run. Every provider except Ollama
# is absent, so the fallback chain can never reach a hosted endpoint.
#
# DISABLED (2026-09-27): the Ollama integration is turned off. The provider
# block below is commented out, so this profile declares no providers and no
# run can select Ollama. Uncomment the block to re-enable local inference.

workspace_path = "."

# No hosted spend is possible: the only provider is local.
budget_usd_per_run = 0.0
budget_usd_per_day = 0.0

[broker]
allow_unbrokered = false

