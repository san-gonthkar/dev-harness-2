[mypy]
python_version = 3.11
strict = true
warn_unused_configs = true
exclude = (^tests/|^scripts/)

[mypy-dev_harness.tui.*]
# Textual widget modules may carry per-module overrides with written justification.
# Widgets are pilot-tested; strict typing of Textual internals is not required.
check_untyped_defs = False
disallow_untyped_defs = False
