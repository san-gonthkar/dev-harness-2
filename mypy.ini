[mypy]
python_version = 3.11
strict = true
warn_unused_configs = true
exclude = (^tests/|^scripts/)

[mypy-dev_harness.tui.*]
# Textual widget modules may carry per-module overrides with written justification.
# Widgets are pilot-tested; strict typing of Textual internals is not required.
check_untyped_defs = False
disallow_untyped_defs = False

[mypy-dev_harness.providers._fake]
# The fake provider is a test double with ASGI plumbing; strict typing of the
# ASGI callable protocol is not required (httpx.ASGITransport accepts it).
check_untyped_defs = False
disallow_untyped_defs = False
disable_error_code = arg-type, operator, no-any-return, attr-defined
