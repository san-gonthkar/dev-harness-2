[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-harness"
version = "0.1.0"
description = "Hermes TUI Dev Harness - agentic SDLC pipeline orchestrator"
requires-python = ">=3.11"
dependencies = [
    "textual==8.2.8",
    "rich==15.0.0",
    "langgraph==1.2.11",
    "langchain-core==1.6.3",
    "pydantic>=2.13.4,<3",
    "httpx==0.28.1",
    "portalocker==4.4.0",
    "tiktoken==0.14.0",
    "keyring==25.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "pytest-socket==0.8.1",
    "pytest-randomly==5.0.0",
    "pytest-repeat==0.9.4",
    "hypothesis==6.168.0",
    "psutil==7.2.2",
    "mutmut==3.8.0",
    "ruff==0.16.8",
    "mypy==2.1.0",
    "coverage==7.14.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dev_harness" = ["py.typed"]

[project.scripts]
dev-harness-broker = "dev_harness.broker.daemon:main"
dev-harness-broker-cli = "dev_harness.broker.cli:main"
